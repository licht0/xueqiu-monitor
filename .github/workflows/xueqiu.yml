name: xueqiu-monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: xueqiu-pages
  cancel-in-progress: false

jobs:
  crawl:
    name: 抓取并构建
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: 写入雪球登录 Cookie
        env:
          XUEQIU_COOKIES: ${{ secrets.XUEQIU_COOKIES }}
        run: |
          mkdir -p data
          printf '%s' "$XUEQIU_COOKIES" > data/cookies.json
          python -m json.tool data/cookies.json >/dev/null

      - name: 抓取并生成加密静态页
        env:
          SNAPSHOT_PASSWORD: ${{ secrets.SNAPSHOT_PASSWORD }}
        run: >
          python xueqiu_monitor.py
          --once
          --no-web
          --snapshot-dir site

      - name: 持久化抓取数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/xueqiu.db data/posts.jsonl data/history_progress.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: update xueqiu data"
            git push
          fi

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: 部署 GitHub Pages
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
